<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="ဆီးချို Lifestyle Management — animated banner">
  <defs>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#041820"/>
      <stop offset="0.55" stop-color="#07303a"/>
      <stop offset="1" stop-color="#0b4a3c"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecfeff"/>
      <stop offset="0.5" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="tealH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dropG" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#fda4af"/>
      <stop offset="0.55" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#be123c"/>
    </radialGradient>
    <radialGradient id="dropGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f43f5e" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbT" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#134e4a"/>
      <stop offset="1" stop-color="#0f3a36"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="titleClip">
      <text x="640" y="216" text-anchor="middle" font-family="'Noto Sans Myanmar','Myanmar Text','Myanmar Sangam MN','Padauk',sans-serif" font-size="104" font-weight="800" letter-spacing="4">ဆီးချို</text>
    </clipPath>
  </defs>
  <style>
    .tw { animation: tw 3.2s ease-in-out infinite; }
    .tw2 { animation: tw 4.3s ease-in-out infinite; animation-delay: -1.5s; }
    .tw3 { animation: tw 2.6s ease-in-out infinite; animation-delay: -2.3s; }
    @keyframes tw { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.95; } }
    .floaty { animation: floaty 7s ease-in-out infinite; }
    .floaty2 { animation: floaty 9s ease-in-out infinite; animation-delay: -3s; }
    .floaty3 { animation: floaty 6s ease-in-out infinite; animation-delay: -1.2s; }
    @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } }
    .heartbeat { transform-box: fill-box; transform-origin: center; animation: heartbeat 1.6s ease-in-out infinite; }
    @keyframes heartbeat { 0%, 100% { transform: scale(1); } 14% { transform: scale(1.18); } 28% { transform: scale(1); } 42% { transform: scale(1.14); } 56% { transform: scale(1); } }
    .sweep { animation: sweep 5.5s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-340px) skewX(-18deg); } 55%, 100% { transform: translateX(1640px) skewX(-18deg); } }
    .shimmer { animation: shimmer 4s ease-in-out infinite; }
    @keyframes shimmer { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }
    .rise { animation: rise 10s linear infinite; }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 18% { opacity: 0.85; } 100% { transform: translateY(-280px); opacity: 0; } }
    .drift { animation: drift 48s linear infinite; }
    @keyframes drift { from { transform: translateX(-200px); } to { transform: translateX(1480px); } }
    .dash { animation: dashmove 7s linear infinite; }
    @keyframes dashmove { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -1600; } }
    .spark { transform-box: fill-box; transform-origin: center; animation: spark 3.8s ease-in-out infinite; }
    @keyframes spark { 0%, 100% { opacity: 0.25; transform: scale(0.7) rotate(0deg); } 50% { opacity: 1; transform: scale(1.15) rotate(20deg); } }
  </style>

  <rect width="1280" height="420" fill="url(#deep)"/>

  <!-- ambient orbs -->
  <circle cx="180" cy="90" r="280" fill="url(#orbT)" opacity="0.55">
    <animate attributeName="opacity" values="0.55;0.3;0.55" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1130" cy="350" r="300" fill="url(#orbG)" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.28;0.5" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- twinkling particles -->
  <g fill="#99f6e4">
    <circle class="tw" cx="70" cy="70" r="2.2"/><circle class="tw2" cx="160" cy="200" r="1.5"/>
    <circle class="tw3" cx="300" cy="60" r="2"/><circle class="tw" cx="420" cy="330" r="1.4"/>
    <circle class="tw2" cx="560" cy="60" r="1.8"/><circle class="tw3" cx="700" cy="340" r="1.5"/>
    <circle class="tw" cx="860" cy="70" r="2"/><circle class="tw2" cx="990" cy="330" r="1.4"/>
    <circle class="tw3" cx="1120" cy="120" r="1.8"/><circle class="tw" cx="1210" cy="240" r="1.5"/>
    <circle class="tw2" cx="120" cy="340" r="1.6"/><circle class="tw3" cx="380" cy="140" r="1.3"/>
    <circle class="tw" cx="940" cy="200" r="1.6"/><circle class="tw2" cx="80" cy="250" r="1.7"/>
  </g>
  <g fill="#86efac">
    <circle class="tw2" cx="240" cy="300" r="2"/><circle class="tw" cx="640" cy="90" r="1.7"/>
    <circle class="tw3" cx="1020" cy="180" r="1.9"/><circle class="tw" cx="520" cy="180" r="1.6"/>
  </g>

  <!-- 4-point sparkles -->
  <g fill="#a7f3d0">
    <path class="spark" style="animation-delay:-1s" transform="translate(480,70)" d="M0,-11 C1.5,-3 3,-1.5 11,0 C3,1.5 1.5,3 0,11 C-1.5,3 -3,1.5 -11,0 C-3,-1.5 -1.5,-3 0,-11 Z"/>
    <path class="spark" style="animation-delay:-2.4s" transform="translate(830,110)" d="M0,-9 C1.2,-2.5 2.5,-1.2 9,0 C2.5,1.2 1.2,2.5 0,9 C-1.2,2.5 -2.5,1.2 -9,0 C-2.5,-1.2 -1.2,-2.5 0,-9 Z"/>
    <path class="spark" style="animation-delay:-0.4s" transform="translate(210,330)" d="M0,-8 C1,-2 2,-1 8,0 C2,1 1,2 0,8 C-1,2 -2,1 -8,0 C-2,-1 -1,-2 0,-8 Z"/>
  </g>

  <!-- ECG heartbeat line across the banner -->
  <g>
    <path d="M-20,330 L120,330 L150,330 L162,300 L174,356 L188,330 L240,330 L300,330 L312,306 L324,350 L338,330 L400,330 L470,330 L482,298 L494,358 L508,330 L570,330 L640,330 L652,304 L664,352 L678,330 L750,330 L820,330 L832,300 L844,356 L858,330 L920,330 L990,330 L1002,306 L1014,350 L1028,330 L1090,330 L1160,330 L1172,298 L1184,358 L1198,330 L1260,330 L1320,330"
          fill="none" stroke="#2dd4bf" stroke-width="2.5" opacity="0.35"/>
    <path class="dash" d="M-20,330 L120,330 L150,330 L162,300 L174,356 L188,330 L240,330 L300,330 L312,306 L324,350 L338,330 L400,330 L470,330 L482,298 L494,358 L508,330 L570,330 L640,330 L652,304 L664,352 L678,330 L750,330 L820,330 L832,300 L844,356 L858,330 L920,330 L990,330 L1002,306 L1014,350 L1028,330 L1090,330 L1160,330 L1172,298 L1184,358 L1198,330 L1260,330 L1320,330"
          fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round"
          stroke-dasharray="170 1430" filter="url(#soft)"/>
  </g>

  <!-- glucose trend chart, lower right -->
  <g opacity="0.9">
    <path d="M880,392 L920,372 L960,378 L1000,352 L1040,360 L1080,336 L1120,344 L1160,322 L1200,330 L1240,312 L1240,420 L880,420 Z" fill="url(#area)"/>
    <path d="M880,392 L920,372 L960,378 L1000,352 L1040,360 L1080,336 L1120,344 L1160,322 L1200,330 L1240,312"
          fill="none" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#4ade80">
      <circle class="pulse" cx="1000" cy="352" r="5"/>
      <circle class="pulse" style="animation-delay:-1.4s" cx="1120" cy="344" r="5"/>
      <circle class="pulse" style="animation-delay:-0.7s" cx="1240" cy="312" r="6"/>
    </g>
  </g>

  <!-- target range band -->
  <g opacity="0.5">
    <rect x="880" y="330" width="360" height="44" fill="#2dd4bf" opacity="0.12"/>
    <line x1="880" y1="330" x2="1240" y2="330" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="6 6" opacity="0.6"/>
    <line x1="880" y1="374" x2="1240" y2="374" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="6 6" opacity="0.6"/>
  </g>

  <!-- giant pulsing glucose droplet, left -->
  <g transform="translate(150,180)">
    <circle class="pulse" cx="0" cy="10" r="105" fill="url(#dropGlow)"/>
    <g class="heartbeat">
      <path d="M0,-62 C34,-22 52,2 52,30 A52,52 0 1,1 -52,30 C-52,2 -34,-22 0,-62 Z" fill="url(#dropG)"/>
      <ellipse cx="-18" cy="26" rx="10" ry="16" fill="#ffffff" opacity="0.35" transform="rotate(-18 -18 26)"/>
      <text x="0" y="46" text-anchor="middle" font-family="Verdana,sans-serif" font-size="26" font-weight="700" fill="#ffffff">126</text>
      <text x="0" y="66" text-anchor="middle" font-family="Verdana,sans-serif" font-size="13" fill="#ffe4e6">mg/dL</text>
    </g>
  </g>

  <!-- floating stat chips -->
  <g class="floaty" opacity="0.95">
    <rect x="1010" y="52" width="196" height="56" rx="16" fill="url(#chip)" stroke="#2dd4bf" stroke-opacity="0.5"/>
    <circle cx="1042" cy="80" r="12" fill="#2dd4bf" opacity="0.25"/>
    <text x="1062" y="76" font-family="Verdana,sans-serif" font-size="19" font-weight="700" fill="#5eead4">HbA1c 6.4%</text>
    <text x="1062" y="96" font-family="Verdana,sans-serif" font-size="12" fill="#99f6e4">lab trend</text>
  </g>
  <g class="floaty2" opacity="0.95">
    <rect x="72" y="52" width="196" height="56" rx="16" fill="url(#chip)" stroke="#4ade80" stroke-opacity="0.5"/>
    <circle cx="104" cy="80" r="12" fill="#4ade80" opacity="0.25"/>
    <text x="124" y="76" font-family="Verdana,sans-serif" font-size="19" font-weight="700" fill="#86efac">8,542</text>
    <text x="124" y="96" font-family="Verdana,sans-serif" font-size="12" fill="#bbf7d0">steps today</text>
  </g>
  <g class="floaty3" opacity="0.95">
    <rect x="920" y="140" width="216" height="56" rx="16" fill="url(#chip)" stroke="#f43f5e" stroke-opacity="0.45"/>
    <circle cx="952" cy="168" r="12" fill="#f43f5e" opacity="0.25"/>
    <text x="972" y="164" font-family="Verdana,sans-serif" font-size="19" font-weight="700" fill="#fda4af">2 / 3 taken</text>
    <text x="972" y="184" font-family="Verdana,sans-serif" font-size="12" fill="#fecdd3">meds today</text>
  </g>

  <!-- floating health icons -->
  <g class="floaty" opacity="0.8" transform="translate(330,110)">
    <rect x="-26" y="-13" width="52" height="26" rx="13" fill="#f8fafc" transform="rotate(-24)"/>
    <rect x="-26" y="-13" width="26" height="26" rx="13" fill="#f43f5e" transform="rotate(-24)"/>
  </g>
  <g class="floaty2" opacity="0.8" transform="translate(950,250)">
    <circle cx="0" cy="0" r="20" fill="#f43f5e" opacity="0.9"/>
    <rect x="-3" y="-30" width="6" height="14" rx="3" fill="#4ade80"/>
    <path d="M0,-10 C8,-18 20,-16 22,-8" fill="none" stroke="#4ade80" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g class="floaty3" opacity="0.75" transform="translate(300,240)">
    <rect x="-24" y="-6" width="48" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="-34" y="-14" width="12" height="28" rx="5" fill="#94a3b8"/>
    <rect x="22" y="-14" width="12" height="28" rx="5" fill="#94a3b8"/>
  </g>

  <!-- rising bubbles -->
  <g fill="#5eead4">
    <circle class="rise" cx="560" cy="400" r="3.2"/>
    <circle class="rise" style="animation-delay:-2.5s" cx="700" cy="410" r="2.4"/>
    <circle class="rise" style="animation-delay:-5s" cx="840" cy="405" r="3"/>
    <circle class="rise" style="animation-delay:-1.2s" cx="420" cy="400" r="2.2"/>
    <circle class="rise" style="animation-delay:-7s" cx="620" cy="415" r="2.6"/>
  </g>

  <!-- drifting mist -->
  <g fill="#2dd4bf" opacity="0.07">
    <ellipse class="drift" cx="0" cy="120" rx="90" ry="26"/>
  </g>

  <!-- hero text -->
  <g text-anchor="middle">
    <text class="shimmer" x="640" y="92" font-family="Verdana,'Segoe UI',system-ui,sans-serif" font-size="19" letter-spacing="9" fill="#5eead4">✨ DIABETES LIFESTYLE MANAGEMENT ✨</text>
    <text x="640" y="216" font-family="'Noto Sans Myanmar','Myanmar Text','Myanmar Sangam MN','Padauk',sans-serif" font-size="104" font-weight="800" letter-spacing="4" fill="url(#teal)" filter="url(#soft)" opacity="0.5">ဆီးချို</text>
    <text x="640" y="216" font-family="'Noto Sans Myanmar','Myanmar Text','Myanmar Sangam MN','Padauk',sans-serif" font-size="104" font-weight="800" letter-spacing="4" fill="url(#teal)">ဆီးချို</text>
    <g clip-path="url(#titleClip)">
      <rect class="sweep" x="0" y="98" width="180" height="140" fill="url(#tealH)" opacity="0.7"/>
    </g>
    <text x="640" y="262" font-family="'Noto Sans Myanmar','Myanmar Text','Myanmar Sangam MN','Padauk',sans-serif" font-size="27" fill="#a7f3d0" letter-spacing="2">နေ့စဉ် ကျန်းမာရေး စီမံခန့်ခွဲမှု</text>
    <text x="640" y="318" font-family="Verdana,'Segoe UI',system-ui,sans-serif" font-size="30" letter-spacing="12" fill="#e0f2f1">LIFESTYLE TRACKER</text>
  </g>

  <!-- bottom wave -->
  <path d="M0,398 C240,380 420,412 660,398 C900,384 1080,410 1280,394 L1280,420 L0,420 Z" fill="#2dd4bf" opacity="0.1"/>
  <path d="M0,408 C260,394 440,418 680,404 C920,390 1100,414 1280,402 L1280,420 L0,420 Z" fill="#2dd4bf" opacity="0.08"/>
</svg>
