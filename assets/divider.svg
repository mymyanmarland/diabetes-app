<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 48" width="640" height="48" role="img" aria-label="teal droplet divider">
  <defs>
    <linearGradient id="dvL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="dvR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dvDrop" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#fda4af"/>
      <stop offset="0.6" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#be123c"/>
    </radialGradient>
  </defs>
  <style>
    .spark { transform-box: fill-box; transform-origin: center; animation: spark 3.4s ease-in-out infinite; }
    @keyframes spark { 0%, 100% { opacity: 0.4; transform: scale(0.75) rotate(0deg); } 50% { opacity: 1; transform: scale(1.2) rotate(25deg); } }
    .flow { animation: flow 4s ease-in-out infinite; }
    @keyframes flow { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    .beat { transform-box: fill-box; transform-origin: center; animation: beat 1.6s ease-in-out infinite; }
    @keyframes beat { 0%, 100% { transform: scale(1); } 14% { transform: scale(1.22); } 28% { transform: scale(1); } 42% { transform: scale(1.16); } 56% { transform: scale(1); } }
  </style>
  <g class="flow">
    <rect x="40" y="23" width="220" height="2.5" rx="1.2" fill="url(#dvL)"/>
    <rect x="380" y="23" width="220" height="2.5" rx="1.2" fill="url(#dvR)"/>
  </g>
  <circle class="spark" style="animation-delay:-1.2s" cx="292" cy="24" r="3.5" fill="#5eead4"/>
  <g class="beat" transform="translate(320,26)">
    <path d="M0,-14 C7,-5 11,0 11,6 A11,11 0 1,1 -11,6 C-11,0 -7,-5 0,-14 Z" fill="url(#dvDrop)"/>
  </g>
  <circle class="spark" style="animation-delay:-2.3s" cx="348" cy="24" r="3.5" fill="#5eead4"/>
</svg>
